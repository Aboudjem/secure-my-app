<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img"
     aria-label="lockpatch: find what a stranger can take from your app.">
  <title>lockpatch</title>
  <defs>
    <linearGradient id="lk-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0D1626"/>
      <stop offset="55%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#080C18"/>
    </linearGradient>
    <radialGradient id="lk-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#2BE844" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2BE844" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#2BE8C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2BE8C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#5BFF74" stop-opacity="0.18"/>
      <stop offset="42%"  stop-color="#2BE8C8" stop-opacity="0.112"/>
      <stop offset="76%"  stop-color="#00D4FF" stop-opacity="0.044"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lk-frame"><rect width="1280" height="640"/></clipPath>
    <linearGradient id="lk-ink" gradientUnits="userSpaceOnUse" x1="40" y1="202" x2="216" y2="54">
      <stop offset="0%"   stop-color="#5BFF74"/>
      <stop offset="52%"  stop-color="#2BE844"/>
      <stop offset="100%" stop-color="#2BE8C8"/>
    </linearGradient>
    <filter id="lk-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="6.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lk-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%"   stop-color="#5BFF74"/>
      <stop offset="46%"  stop-color="#2BE844"/>
      <stop offset="100%" stop-color="#2BE8C8"/>
    </linearGradient>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: 5px; fill: #5BFF74; }
    .head    { font-size: 38px; font-weight: 700; fill: #F2F6FF; letter-spacing: -0.5px; }
    .sub     { font-size: 20px; font-weight: 500; fill: #C2CDE4; }
    .tag     { font-size: 15px; letter-spacing: 1.6px; fill: #93A2BE; }
    .proof   { font-size: 17px; fill: #93A2BE; }
    .plabel  { font-size: 17px; letter-spacing: 1.6px; fill: #5B6B85; }
    .bad     { fill: #FF2D78; }
    .good    { fill: #2BE844; }
    @media (prefers-reduced-motion: reduce) { * { } }
  </style>

  <rect width="1280" height="640" fill="url(#lk-ground)"/>
  <g>
    <rect width="1280" height="640" fill="url(#lk-bloomA)"/>
    <rect width="1280" height="640" fill="url(#lk-bloomB)"/>
    <rect width="1280" height="640" fill="url(#lk-bloomC)"/>
  </g>
  <g clip-path="url(#lk-frame)">
    <g transform="translate(0,320)">
      <ellipse cx="0" cy="0" rx="520" ry="380" fill="url(#lk-wash)"/>
    </g>
  </g>

  <g transform="translate(883.8,147.2) scale(1.35)">
    <g stroke="#2BE844" stroke-opacity="0.30" stroke-width="15" stroke-linecap="round">
      <line x1="41.1" y1="178" x2="214.9" y2="178"/>
      <line x1="50.9" y1="140" x2="205.1" y2="140"/>
      <line x1="60.7" y1="102" x2="195.3" y2="102"/>
      <line x1="70.5" y1="64"  x2="185.5" y2="64"/>
    </g>
    <g stroke="url(#lk-ink)" stroke-width="8" stroke-linecap="round" filter="url(#lk-glow)">
      <line x1="36" y1="198" x2="72" y2="58"/>
      <line x1="220" y1="198" x2="184" y2="58"/>
    </g>
    <g stroke="url(#lk-ink)" stroke-width="15" stroke-linecap="round" filter="url(#lk-glow)">
      <line x1="41.1" y1="178" x2="214.9" y2="178"/>
      <line x1="50.9" y1="140" x2="205.1" y2="140" opacity="0.74"/>
      <line x1="60.7" y1="102" x2="195.3" y2="102" opacity="0.48"/>
      <line x1="70.5" y1="64"  x2="185.5" y2="64" opacity="0.26"/>
    </g>
  </g>

  <g filter="url(#lk-glow)">
    <text class="disp" x="96" y="358" font-size="110" font-weight="800"
          letter-spacing="-3.9" fill="url(#lk-word)">lockpatch</text>
  </g>
  <text class="mono eyebrow" x="96" y="258">CLAUDE CODE SKILL</text>
  <text class="disp head" x="96" y="416">Find what a stranger can take from your app.</text>
  <text class="disp sub" x="96" y="458">Then close it and prove it closed.</text>
  <g>
    <text class="mono plabel" x="96" y="518">BEFORE</text>
    <text class="mono proof"  x="196" y="518">curl -s $APP/api/orders/1042</text>
    <text class="mono proof bad" x="560" y="518">200 OK</text>
    <text class="mono plabel" x="96" y="550">AFTER</text>
    <text class="mono proof"  x="196" y="550">curl -s $APP/api/orders/1042</text>
    <text class="mono proof good" x="560" y="550">403 REFUSED</text>
  </g>
  <text class="mono tag" x="96" y="604">github.com/Aboudjem/lockpatch</text>
</svg>
