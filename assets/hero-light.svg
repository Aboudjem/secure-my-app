<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="secure-my-app. What can a stranger take? Three points: fixes proven closed, proof for each hole, no surprise changes. In the real sample, alice asks for bob's invoice with GET /api/invoices/1042 and gets 200 before the fix, and 404 after it. Install with npx skills add Aboudjem/secure-my-app -g. Full runs tested in Claude Code and Codex CLI.">
  <title>secure-my-app</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#F6F8FC"/>
      <stop offset="100%" stop-color="#EEF2F9"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8104F"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="14" fill="url(#g)"/>
  <g transform="scale(1.0000)">
    <text x="56" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#0E7A26">secure-my-app</text>
    <text x="54" y="140" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#0A0F1C">What can a stranger take?</text>
    <rect x="56" y="176" width="246" height="46" rx="23" fill="#E9F7EC" stroke="#0E7A26" stroke-width="1.5"/>
    <text x="179.0" y="206" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0F1C">Fixes proven closed</text>
    <rect x="320" y="176" width="246" height="46" rx="23" fill="#E9F7EC" stroke="#0E7A26" stroke-width="1.5"/>
    <text x="443.0" y="206" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0F1C">Proof for each hole</text>
    <rect x="584" y="176" width="246" height="46" rx="23" fill="#E9F7EC" stroke="#0E7A26" stroke-width="1.5"/>
    <text x="707.0" y="206" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0A0F1C">No surprise changes</text>
    <rect x="56" y="270" width="500" height="54" rx="10" fill="#0E1524" stroke="#C9D2E3" stroke-width="1"/>
    <text x="76" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#F2F6FF"><tspan fill="#2BE844">$</tspan> npx skills add Aboudjem/secure-my-app -g</text>
    <text x="56" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#3D4A63">Agent skills · Full runs tested: Claude Code, Codex CLI</text>
    <text x="56" y="394" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#5B6B85">Not a penetration test. Each fix waits for your yes.</text>
    <rect x="612" y="264" width="532" height="160" rx="12" fill="#FFFFFF" stroke="#C9D2E3" stroke-width="1"/>
    <rect x="630" y="282" width="92" height="124" rx="8" fill="none" stroke="#1F5FCC" stroke-width="2"/>
    <text x="676.0" y="351.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#0A0F1C">alice</text>
    <rect x="1006" y="282" width="120" height="124" rx="8" fill="#F2F5FB" stroke="#5B6B85" stroke-width="1.5"/>
    <text x="1066.0" y="340.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#0A0F1C">bob&#8217;s</text>
    <text x="1066.0" y="362.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#3D4A63">invoice 1042</text>
    <text x="736" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#3D4A63">GET /api/invoices/1042 <tspan fill="#C8104F" font-weight="700">-&gt; 200</tspan></text>
    <line x1="732" y1="322" x2="998" y2="322" stroke="#C8104F" stroke-width="3" marker-end="url(#ar)"/>
    <text x="736" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#3D4A63">after the fix <tspan fill="#0E7A26" font-weight="700">-&gt; 404</tspan></text>
    <line x1="732" y1="388" x2="946" y2="388" stroke="#0E7A26" stroke-width="3"/>
    <line x1="948" y1="374" x2="948" y2="402" stroke="#0E7A26" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
