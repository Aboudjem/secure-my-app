<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="secure-my-app: find what a stranger can take from your app, then close it and prove it closed. Before the fix the attacker's request returns 200 OK and a real user's request returns 200 OK. After the fix the attacker's request is refused with 403 and the real user's request still returns 200 OK.">
  <title>secure-my-app</title>
  <desc>Light-mode hero. The paired test that defines the tool: every fix is re-run twice, once as
  the attacker and once as a real user, and it only counts when the attacker is refused and the
  real user still works.</desc>
  <defs>
    <linearGradient id="lk-ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#EEF1F7"/>
    </linearGradient>
    <radialGradient id="lk-bloomA" cx="0.15" cy="0.13" r="0.44">
      <stop offset="0%" stop-color="#12752A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#12752A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-bloomB" cx="0.88" cy="0.85" r="0.50">
      <stop offset="0%" stop-color="#006A80" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#006A80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lk-bloomC" cx="0.52" cy="0.04" r="0.36">
      <stop offset="0%" stop-color="#0B6D5D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B6D5D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lk-rule" gradientUnits="userSpaceOnUse" x1="44" y1="88" x2="1156" y2="88">
      <stop offset="0%"   stop-color="#12752A" stop-opacity="0.65"/>
      <stop offset="45%"  stop-color="#0B6D5D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#006A80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lk-ink" gradientUnits="userSpaceOnUse" x1="40" y1="202" x2="216" y2="54">
      <stop class="lkk1" offset="0%"   stop-color="#12752A"/>
      <stop class="lkk2" offset="52%"  stop-color="#12752A"/>
      <stop class="lkk3" offset="100%" stop-color="#0B6D5D"/>
    </linearGradient>
    <linearGradient id="lk-word" x1="0" y1="0" x2="1" y2="0.25">
      <stop class="lkk1" offset="0%"   stop-color="#12752A"/>
      <stop class="lkk2" offset="46%"  stop-color="#12752A"/>
      <stop class="lkk3" offset="100%" stop-color="#0B6D5D"/>
    </linearGradient>
    <clipPath id="lk-frame"><rect width="1200" height="400" rx="14"/></clipPath>
  </defs>

  <style>
    .disp { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .kick  { font-size: 12px; font-weight: 600; letter-spacing: 3.2px; fill: #12752A; }
    .lede  { font-size: 25px; font-weight: 700; fill: #1A2233; letter-spacing: -0.3px; }
    .lede2 { font-size: 25px; font-weight: 500; fill: #5C6980; letter-spacing: -0.3px; }
    .colhd { font-size: 12px; font-weight: 600; letter-spacing: 2.4px; fill: #5C6980; }
    .rowhd { font-size: 12px; font-weight: 600; letter-spacing: 2.4px; fill: #79869B; }
    .cmd   { font-size: 14px; fill: #48546B; }
    .res   { font-size: 13.5px; font-weight: 600; }
    .tag   { font-size: 11.5px; letter-spacing: 1.6px; fill: #5C6980; }
    .card  { fill: #FFFFFF; stroke: #D8DEE9; stroke-width: 1; }

    @keyframes lk-breathe { 0%,100% { opacity:0.72; } 50% { opacity:1; } }
    .lkbloom { animation: lk-breathe 11s ease-in-out infinite; }
    @keyframes lk-flow { to { stroke-dashoffset: -240; } }
    .flowline { animation: lk-flow 14s linear infinite; }
    @keyframes lk-drop { to { stroke-dashoffset: -40; } }
    .dropline { animation: lk-drop 3.2s linear infinite; }
    @keyframes lk-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .row-fix { animation: lk-rise 0.7s ease-out 0.8s both; }
    .row-new { animation: lk-rise 0.7s ease-out 1.4s both; }
    @keyframes lk-pip { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .hole { animation: lk-pip 2.6s ease-in-out infinite; }
    .shut { animation: lk-pip 2.6s ease-in-out infinite 1.3s; }
    /* one rung at a time, bottom to top: exists, reach, control, impact */
    @keyframes lk-climb { 0% { opacity:0; } 3% { opacity:1; } 21% { opacity:1; } 24%,100% { opacity:0; } }
    .lkr1 { animation: lk-climb 8s linear infinite 0s; }
    .lkr2 { animation: lk-climb 8s linear infinite -6s; }
    .lkr3 { animation: lk-climb 8s linear infinite -4s; }
    .lkr4 { animation: lk-climb 8s linear infinite -2s; }
    @keyframes lk-k1 { 0%,100% { stop-color:#12752A; } 50% { stop-color:#12752A; } }
    @keyframes lk-k2 { 0%,100% { stop-color:#12752A; } 50% { stop-color:#0B6D5D; } }
    @keyframes lk-k3 { 0%,100% { stop-color:#0B6D5D; } 50% { stop-color:#006A80; } }
    .lkk1 { animation: lk-k1 12s ease-in-out infinite; }
    .lkk2 { animation: lk-k2 12s ease-in-out infinite; }
    .lkk3 { animation: lk-k3 12s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#lk-frame)">
    <rect width="1200" height="400" fill="url(#lk-ground)"/>
    <g class="lkbloom">
      <rect width="1200" height="400" fill="url(#lk-bloomA)"/>
      <rect width="1200" height="400" fill="url(#lk-bloomB)"/>
      <rect width="1200" height="400" fill="url(#lk-bloomC)"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="13.5" fill="none" stroke="#D8DEE9" stroke-width="1"/>

  <g transform="translate(35.41,9.42) scale(0.3015)">
    <g stroke="#12752A" stroke-opacity="0.26" stroke-width="15" stroke-linecap="round">
      <line x1="41.1" y1="178" x2="214.9" y2="178"/>
      <line x1="50.9" y1="140" x2="205.1" y2="140"/>
      <line x1="60.7" y1="102" x2="195.3" y2="102"/>
      <line x1="70.5" y1="64"  x2="185.5" y2="64"/>
    </g>
    <g stroke="url(#lk-ink)" stroke-width="8" stroke-linecap="round">
      <line x1="36" y1="198" x2="72" y2="58"/>
      <line x1="220" y1="198" x2="184" y2="58"/>
    </g>
    <g stroke="url(#lk-ink)" stroke-width="15" stroke-linecap="round">
      <line class="lkr1" x1="41.1" y1="178" x2="214.9" y2="178"/>
      <line class="lkr2" x1="50.9" y1="140" x2="205.1" y2="140" opacity="0"/>
      <line class="lkr3" x1="60.7" y1="102" x2="195.3" y2="102" opacity="0"/>
      <line class="lkr4" x1="70.5" y1="64"  x2="185.5" y2="64" opacity="0"/>
    </g>
  </g>
  <text class="disp" x="124" y="60" font-size="34" font-weight="800"
        letter-spacing="-0.8" fill="url(#lk-word)">secure-my-app</text>
  <text class="mono kick" x="1156" y="60" text-anchor="end">PROOF, NOT ADVICE</text>

  <line x1="44" y1="88" x2="1156" y2="88" stroke="url(#lk-rule)" stroke-width="1.25"/>
  <line class="flowline" x1="44" y1="88" x2="1156" y2="88" stroke="url(#lk-rule)"
        stroke-width="1.25" stroke-dasharray="3 9"/>

  <text class="disp lede" x="44" y="124">Find what a stranger can take from your app.<tspan class="lede2" dx="10">Then close it and prove it closed.</tspan></text>

  <text class="mono colhd" x="124" y="156">THE ATTACKER'S REQUEST</text>
  <text class="mono colhd" x="650" y="156">A REAL USER'S REQUEST</text>
  <text class="mono rowhd" x="44" y="201">BEFORE</text>
  <text class="mono rowhd" x="44" y="307">AFTER</text>

  <rect x="124" y="166" width="506" height="62" rx="10" class="card"/>
  <rect x="124" y="182" width="3" height="30" rx="1.5" fill="#A81447"/>
  <text class="mono cmd" x="144" y="192">curl -s $APP/api/orders/1042</text>
  <g class="hole">
    <rect x="144" y="206" width="7" height="7" rx="2" fill="#A81447"/>
    <text class="mono res" x="160" y="213" fill="#A81447">200 OK  &#183;  another tenant's order, in full</text>
  </g>

  <rect x="650" y="166" width="506" height="62" rx="10" class="card"/>
  <rect x="650" y="182" width="3" height="30" rx="1.5" fill="#2C5FA8"/>
  <text class="mono cmd" x="670" y="192">curl -s -b "$SESSION" $APP/api/orders/7</text>
  <rect x="670" y="206" width="7" height="7" rx="2" fill="#12752A"/>
  <text class="mono res" x="686" y="213" fill="#12752A">200 OK  &#183;  their own order</text>

  <g stroke="#D8DEE9" stroke-width="2">
    <line x1="377" y1="228" x2="377" y2="238"/><line x1="903" y1="228" x2="903" y2="238"/>
    <line x1="377" y1="262" x2="377" y2="272"/><line x1="903" y1="262" x2="903" y2="272"/>
  </g>
  <g class="dropline" stroke="#12752A" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.9">
    <line x1="377" y1="228" x2="377" y2="238"/><line x1="903" y1="228" x2="903" y2="238"/>
    <line x1="377" y1="262" x2="377" y2="272"/><line x1="903" y1="262" x2="903" y2="272"/>
  </g>

  <g class="row-fix">
    <rect x="124" y="238" width="1032" height="24" rx="7" fill="#F4F7F2"
          stroke="#12752A" stroke-opacity="0.4" stroke-width="1"/>
    <text class="mono" x="640" y="254" font-size="13.5" fill="#12752A" text-anchor="middle">FIX APPLIED  &#183;  one finding, on your approval  &#183;  nothing else touched</text>
  </g>

  <g class="row-new">
    <rect x="124" y="272" width="506" height="62" rx="10" class="card"/>
    <rect x="124" y="288" width="3" height="30" rx="1.5" fill="#A81447"/>
    <text class="mono cmd" x="144" y="298">curl -s $APP/api/orders/1042</text>
    <g class="shut">
      <rect x="144" y="312" width="7" height="7" rx="2" fill="#12752A"/>
      <text class="mono res" x="160" y="319" fill="#12752A">403 REFUSED  &#183;  the app said no</text>
    </g>

    <rect x="650" y="272" width="506" height="62" rx="10" class="card"/>
    <rect x="650" y="288" width="3" height="30" rx="1.5" fill="#2C5FA8"/>
    <text class="mono cmd" x="670" y="298">curl -s -b "$SESSION" $APP/api/orders/7</text>
    <rect x="670" y="312" width="7" height="7" rx="2" fill="#12752A"/>
    <text class="mono res" x="686" y="319" fill="#12752A">200 OK  &#183;  their own order, still</text>
  </g>

  <text class="mono tag" x="44" y="364">no proof, no finding  &#183;  read only until you approve  &#183;  runs locally</text>
  <text class="mono tag" x="1156" y="364" text-anchor="end" fill="#79869B">NO RE-PROOF, NO FIX</text>
</svg>
